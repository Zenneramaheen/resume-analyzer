# Render Blueprint: one-click deploy of Resume Analyzer (free tier).
# Dashboard flow: render.com → New → Blueprint → connect this repo → Apply.
# Render then creates the web service + Postgres, wires DATABASE_URL,
# generates JWT_SECRET_KEY, and redeploys on every push to main.

services:
  - type: web
    name: resume-analyzer
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resume-analyzer-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      # Optional: paste an OpenAI key later to enable LLM-enriched feedback.
      # The heuristic analyzer works without it.
      # - key: OPENAI_API_KEY
      #   sync: false

databases:
  - name: resume-analyzer-db
    plan: free
